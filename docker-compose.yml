services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  credential:
    build:
      context: .
      dockerfile: services/credential/Dockerfile
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_MODE: mock
      NEXT_PUBLIC_CREDENTIAL_URL: http://credential:4000
      NEXT_PUBLIC_CORE_URL: http://core:8000
    ports:
      - "3000:3000"
    depends_on:
      - credential
      - core
volumes:
  mongo_data:
